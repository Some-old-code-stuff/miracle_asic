[group:asic_all_celery]
programs=asic_celery_beat,asic_celery_default,asic_celery_update,asic_celery_create_asics

[group:asic_without_celery]
programs=asic_http,asic_frontend,asic_postgraphile

[program:asic_http]
command=uwsgi -x /home/miracle_asic/miracle_asic/deploy/uwsgi.conf.xml
directory=/home/miracle_asic/miracle_asic
autostart=true
autorestart=true
redirect_stderr=true
stopsignal=QUIT
stopasgroup=true
stderr_logfile = /home/miracle_asic/miracle_asic/log/uwsgi-err.log
stdout_logfile = /home/miracle_asic/miracle_asic/log/uwsgi-out.log
user=miracle_asic

[program:asic_postgraphile]
command=postgraphile -c postgres://miracle_asic:miracle_asic@localhost/miracle_asic -o -w  --simple-collections only -q /apiv2 -i /apiv2_gui
directory=/home/miracle_asic/miracle_asic/frontend
autostart=true
autorestart=true
redirect_stderr=true
stopsignal=QUIT
stopasgroup=true
stderr_logfile = /home/miracle_asic/miracle_asic/log/postgraphile-err.log
stdout_logfile = /home/miracle_asic/miracle_asic/log/postgraphile-out.log
user=miracle_asic

[program:asic_frontend]
command=npm start
directory=/home/miracle_asic/miracle_asic/frontend
autostart=true
autorestart=true
redirect_stderr=true
stopsignal=QUIT
stopasgroup=true
stderr_logfile = /home/miracle_asic/miracle_asic/log/npm-err.log
stdout_logfile = /home/miracle_asic/miracle_asic/log/npm-out.log
user=miracle_asic

[program:asic_celery_beat]
command=/home/miracle_asic/.virtualenvs/miracle_asic/bin/celery -A main beat -l info -S django
autostart=true
autorestart=true
redirect_stderr=true
directory=/home/miracle_asic/miracle_asic
stderr_logfile= /home/miracle_asic/miracle_asic/log/celery-beat-err.log
stdout_logfile= /home/miracle_asic/miracle_asic/log/celery-beat-out.log
user=miracle_asic

[program:asic_celery_default]
command=//home/miracle_asic/.virtualenvs/miracle_asic/bin/celery -A main worker -Q celery --concurrency=4 -n default@%%h -Ofair --max-memory-per-child=100000
autostart=true
autorestart=true
redirect_stderr=true
directory=/home/miracle_asic/miracle_asic
stderr_logfile= /home/miracle_asic/miracle_asic/log/celery-update-err.log
stdout_logfile= /home/miracle_asic/miracle_asic/log/celery-update-out.log
stopsignal=KILL
user=miracle_asic

[program:asic_celery_update]
command=/home/miracle_asic/.virtualenvs/miracle_asic/bin/celery -A main worker -Q update --concurrency=4 -n update@%%h -Ofair --max-memory-per-child=100000
autostart=true
autorestart=true
redirect_stderr=true
directory=/home/miracle_asic/miracle_asic
stderr_logfile= /home/miracle_asic/miracle_asic/log/celery-update-err.log
stdout_logfile= /home/miracle_asic/miracle_asic/log/celery-update-out.log
stopsignal=KILL
user=miracle_asic


[program:asic_celery_create_asics]
command=/home/miracle_asic/.virtualenvs/miracle_asic/bin/celery -A main worker -Q create_asics --concurrency=1 -n create_asics@%%h -Ofair --max-memory-per-child=100000
autostart=true
autorestart=true
redirect_stderr=true
directory=/home/miracle_asic/miracle_asic
stderr_logfile= /home/miracle_asic/miracle_asic/log/celery-update-asics-err.log
stdout_logfile= /home/miracle_asic/miracle_asic/log/celery-update-asics-out.log
stopsignal=KILL
user=miracle_asic

[program:asic_flower]
command=/home/miracle_asic/.virtualenvs/miracle_asic/bin/flower -A main --port=7777
directory=/home/miracle_asic/miracle_asic
autostart=true
autorestart=true
redirect_stderr=true
stderr_logfile= /home/miracle_asic/miracle_asic/log/flower-err.log
stdout_logfile= /home/miracle_asic/miracle_asic/log/flower-out.log
user=miracle_asic

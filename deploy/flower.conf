
upstream flower {
        server unix:/tmp/flower.sock;
}

server {
    listen 80;
    server_name 192.168.99.2;
    charset utf-8;

    location /flower {
        rewrite ^/flower/(.*)$ /$1 break;
        proxy_pass http://localhost:7777;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }
}

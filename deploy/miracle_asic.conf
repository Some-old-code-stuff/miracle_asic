server {
        listen       192.168.99.2:80;
        server_name  monitoring_system.io 192.168.99.2;

	    location /media/ {
            alias /home/miracle_asic/miracle_asic/media/;
        }

        location / {
            proxy_pass http://localhost:8085/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
        location ~ ^/(admin|silk|profile) {
		    include uwsgi_params;
            error_log /var/log/miracle_asic_error.log;
            access_log /var/log/miracle_asic_access.log;
            uwsgi_param SCRIPT_NAME '';
            uwsgi_param  UWSGI_SCHEME   $scheme;
	        uwsgi_param   Host                 $host;
	        uwsgi_param   X-Real-IP            $remote_addr;
	        uwsgi_param   X-Forwarded-For      $proxy_add_x_forwarded_for;
	        uwsgi_param   X-Forwarded-Proto    $http_x_forwarded_proto;


            uwsgi_pass unix:///home/miracle_asic/miracle_asic.sock;
            uwsgi_ignore_client_abort on;
        }
        location ~ ^/(apiv2|apiv2_gui) {
            proxy_pass http://localhost:5000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }

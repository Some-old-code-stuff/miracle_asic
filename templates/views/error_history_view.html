<div class="modal fade" id="{{ modal_name }}_modal_{{ modal_id }}" tabindex="{{ tabindex }}" role="dialog"
     aria-labelledby="warning_modal_label">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Закрыть"><span
                        aria-hidden="true">&times;</span></button>
                <h4 class="modal-title" id="error_modal_label">История ошибок</h4>
            </div>
            <div class="modal-body container-fluid">
                <div class="row col-md-12">
                    <table class="table table-striped table-bordered">
                        <thead>
                        <tr>
                            <th>Появилась</th>
                            <th>Статус ошибки</th>
                            <th>Тип ошибки</th>
                            <th>Сообщение ошибки</th>
                            <th>Действия</th>
                        </tr>
                        </thead>
                        <tbody>
                        {% load error_views %}
                        {% for error in errors %}
                            {% error_dashboard_view error %}
                        {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="model-footer">
                {#                <a href="" class="btn btn-primary">Обновить</a>#}
            </div>
        </div>
    </div>
</div>
